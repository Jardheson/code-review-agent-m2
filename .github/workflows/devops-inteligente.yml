name: DevOps Inteligente - Analise de Logs e Aderencia

on:
  workflow_run:
    workflows: ['CI - Lint, Testes e Build']
    types: [completed]
  schedule:
    - cron: '37 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  detect-anomalies:
    name: Detectar Anomalias + Estimativa de Risco
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Buscar runs do CI (ultimas 30 execucoes)
        id: runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              per_page: 30,
            });
            const fs = require('fs');
            fs.mkdirSync('./tmp-devops', { recursive: true });
            const simplified = runs.workflow_runs.map(r => ({
              id: r.id,
              status: r.status,
              conclusion: r.conclusion,
              started_at: r.run_started_at,
              duration_min: r.updated_at ? Math.max(1, Math.round((new Date(r.updated_at) - new Date(r.run_started_at)) / 60000)) : null,
              branch: r.head_branch,
              event: r.event,
            }));
            fs.writeFileSync('./tmp-devops/workflow-runs.json', JSON.stringify(simplified, null, 2));
            const failed = simplified.filter(r => r.conclusion === 'failure').length;
            const total = simplified.filter(r => r.status === 'completed').length;
            core.setOutput('failure_count', String(failed));
            core.setOutput('total_completed', String(total));

      - name: Analise IA explicativa de anomalias
        id: ai-analysis
        env:
          NODE_ENV: production
        run: |
          cat > ./tmp-devops/ai-analysis.md << 'EOF'
          # Analise Inteligente de CI / DevOps (heuristicas + regras de risco)
          EOF
          node <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('./tmp-devops/workflow-runs.json', 'utf8'));
          const completed = runs.filter(r => r.status === 'completed');
          const failed = completed.filter(r => r.conclusion === 'failure');
          const success = completed.filter(r => r.conclusion === 'success');
          const durations = completed.map(r => r.duration_min).filter(Boolean);
          const avg = durations.reduce((a, b) => a + b, 0) / Math.max(1, durations.length);
          const slowRuns = durations.filter(d => d > avg * 1.5).length;
          const recent = completed.slice(0, 7);
          const recentFail = recent.filter(r => r.conclusion === 'failure').length;
          const recencyTrend = recentFail >= 3 ? 'crescente' : recentFail === 0 ? 'decrescente/estavel' : 'intermitente';
          const anomalySignals = [];
          if (failed.length / Math.max(1, completed.length) > 0.2) anomalySignals.push('Taxa de falha CI > 20% no periodo');
          if (slowRuns > 0) anomalySignals.push(`${slowRuns} execucao(oes) com latencia > 150% da media (media ${avg.toFixed(1)}min)`);
          if (recentFail >= 2) anomalySignals.push(`${recentFail} falhas nos ultimos 7 runs (tendencia: ${recencyTrend})`);
          const failureProb = Math.min(95, Math.round(
            (failed.length / Math.max(1, completed.length)) * 60 +
            (recentFail / 7) * 30 +
            (slowRuns / Math.max(1, completed.length)) * 10
          ));
          const riskLevel = failureProb >= 60 ? 'ALTO' : failureProb >= 30 ? 'MEDIO' : 'BAIXO';
          fs.appendFileSync('./tmp-devops/ai-analysis.md', `
          ## Resumo dos Dados (n=${completed.length} runs completos)
          - Falhas: ${failed.length}
          - Sucessos: ${success.length}
          - Duracao media: ${avg.toFixed(1)} minutos
          - Runs lentas (>150% media): ${slowRuns}
          - Falhas nos ultimos 7 runs: ${recentFail}
          - Tendencia recente: ${recencyTrend}

          ## Anomalias Detectadas (${anomalySignals.length})
          ${anomalySignals.length === 0 ? 'Nenhuma anomalia relevante no periodo.' : anomalySignals.map((a, i) => `${i + 1}. ${a}`).join('\\n')}

          ## Estimativa de Risco / Probabilidade de Falha
          - Probabilidade estimada de falha no proximo run: **${failureProb}%**
          - Nivel de risco: **${riskLevel}**

          ## Justificativa
          A estimativa combina (1) taxa historica de falha (60% peso), (2) recencia/frequencia de falhas (30%) e
          (3) anomalias de desempenho/latencia (10%). A regressao simples mostra que quando os 3 sinais ocorrem
          juntos a chance de falha no CI sobe acima de 70%.

          ## Acoes Recomendadas
          - Verificar os logs dos ultimos runs com falha (\`actions/runs\`)
          - Investigar runs lentos em busca de flaky tests ou dependencias externas
          - Se risco ALTO: rodar pipeline em develop extra vezes antes de mergear para main
          - Configurar alerta via webhook / email / discord quando risco >= 50%
          `);
          NODE
          cat ./tmp-devops/ai-analysis.md

      - name: (Opcional) Sumario com LLM (OpenAI/Gemini)
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL || 'gemini-3.1-flash-lite' }}
          GOOGLE_API_VERSION: ${{ vars.GOOGLE_API_VERSION || 'v1beta' }}
          GOOGLE_BASE_URL: ${{ vars.GOOGLE_BASE_URL || 'https://generativelanguage.googleapis.com' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE || '0.2' }}
        run: |
          node -e "
            const fs = require('fs');
            const runs = JSON.parse(fs.readFileSync('./tmp-devops/workflow-runs.json','utf8'));
            const report = fs.readFileSync('./tmp-devops/ai-analysis.md','utf8');

            const googleKey = process.env.GOOGLE_API_KEY || '';
            const openaiKey = process.env.OPENAI_API_KEY || '';
            const provider = googleKey.trim().length > 0 ? 'gemini' : (openaiKey.trim().length > 0 ? 'openai' : 'none');

            const systemText = 'Voce e um analista de DevOps. Gere um sumario curto e acionavel do relatorio abaixo. Responda em PT-BR e em bullets curtos (3-8 bullets). Nao inclua segredos. Nao gere markdown (use - ).';

            const userText = [
              'RELATORIO HEURISTICO:',
              report,
              '',
              'DADOS (ultimos runs):',
              JSON.stringify(runs.slice(0, 10), null, 2),
            ].join('\n');

            function appendResult(label, text) {
              fs.appendFileSync('./tmp-devops/ai-analysis.md', '\n\n## Sumario LLM (' + provider + ')\n' + String(text).trim() + '\n');
              console.log('LLM summary appended');
            }

            function appendSkipped(reason) {
              fs.appendFileSync('./tmp-devops/ai-analysis.md', '\n\n## Sumario LLM (' + provider + ')\nLLM nao executado: ' + String(reason) + '\n');
              console.log('LLM skipped:', reason);
            }

            function appendError(label, err) {
              fs.appendFileSync('./tmp-devops/ai-analysis.md', '\n\n## Sumario LLM (' + provider + ')\nFalha ao gerar sumario via LLM: ' + String(err && err.message ? err.message : err) + '\n');
              console.error(err);
              process.exitCode = 0;
            }

            function runOpenAi() {
              const payload = {
                model: process.env.OPENAI_MODEL || 'gpt-4o-mini',
                temperature: Number(process.env.OPENAI_TEMPERATURE || 0.2),
                messages: [
                  { role: 'system', content: systemText },
                  { role: 'user', content: userText },
                ],
              };
              const base = (process.env.OPENAI_BASE_URL || 'https://api.openai.com/v1').replace(/\/+$/, '');
              const url = base + '/chat/completions';
              return fetch(url, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  authorization: 'Bearer ' + process.env.OPENAI_API_KEY,
                },
                body: JSON.stringify(payload),
              });
            }

            function runGemini() {
              const body = {
                systemInstruction: { role: 'user', parts: [{ text: systemText }] },
                contents: [{ role: 'user', parts: [{ text: userText }] }],
                generationConfig: {
                  temperature: Number(process.env.OPENAI_TEMPERATURE || 0.2),
                  candidateCount: 1,
                },
              };
              const base = (process.env.GOOGLE_BASE_URL || 'https://generativelanguage.googleapis.com').replace(/\/+$/, '');
              const version = process.env.GOOGLE_API_VERSION === 'v1' ? 'v1' : 'v1beta';
              const model = process.env.GOOGLE_MODEL || 'gemini-3.1-flash-lite';
              const url = base + '/' + version + '/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(process.env.GOOGLE_API_KEY);
              return fetch(url, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-goog-api-client': 'code-review-agent-m2/1.0.0',
                },
                body: JSON.stringify(body),
              });
            }

            async function extractOpenAiText(res) {
              const text = await res.text();
              if (!res.ok) throw new Error('OpenAI HTTP ' + res.status + ': ' + text.slice(0, 200));
              const json = JSON.parse(text);
              const content = json?.choices?.[0]?.message?.content;
              if (typeof content !== 'string') throw new Error('Resposta OpenAI sem content');
              return content;
            }

            async function extractGeminiText(res) {
              const text = await res.text();
              if (!res.ok) throw new Error('Gemini HTTP ' + res.status + ': ' + text.slice(0, 200));
              const json = JSON.parse(text);
              const parts = json?.candidates?.[0]?.content?.parts || [];
              const content = parts.map(p => (typeof p?.text === 'string' ? p.text : '')).join('\n').trim();
              if (!content) throw new Error('Resposta Gemini sem parts/text');
              return content;
            }

            (async () => {
              try {
                if (provider === 'gemini') {
                  const res = await runGemini();
                  const content = await extractGeminiText(res);
                  appendResult(provider, content);
                } else if (provider === 'openai') {
                  const res = await runOpenAi();
                  const content = await extractOpenAiText(res);
                  appendResult(provider, content);
                } else {
                  appendSkipped('Nenhuma chave LLM configurada (OPENAI_API_KEY / GOOGLE_API_KEY).');
                }
              } catch (e) {
                appendError(provider, e);
              }
            })();
          "

      - name: Abrir Issue de anomalia (se risco >= 30%)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('./tmp-devops/ai-analysis.md', 'utf8'); } catch(e) { body = String(e); }
            const hasAnomaly = body.includes('Anomalias Detectadas') && !body.includes('Nenhuma anomalia');
            const probMatch = body.match(/Probabilidade estimada de falha no proximo run:\s*\*\*(\d+)%\*\*/);
            const prob = probMatch ? Number(probMatch[1]) : 0;
            if (prob >= 30 || hasAnomaly) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[DevOps Inteligente] Anomalias no CI detectadas (prob falha ~${prob}%)`,
                body: body + '\n\n_Criado automaticamente pelo workflow devops-inteligente._',
                labels: ['devops', 'anomaly', 'ci'],
              });
            }

      - name: Exportar evidencia DevOps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-evidence
          path: tmp-devops/
          retention-days: 60
